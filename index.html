!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Winner</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        #game-box { background: #333; padding: 30px; border-radius: 15px; border: 2px solid #00ff00; }
        #multiplier { font-size: 60px; color: #00ff00; margin: 20px; font-weight: bold; }
        button { padding: 15px 30px; font-size: 18px; background: #00ff00; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        #cashOutBtn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="game-box">
        <h2>LUCKY WINNER</h2>
        <div id="multiplier">1.00x</div>
        <button id="startBtn" onclick="startGame()">START GAME</button>
        <button id="cashOutBtn" onclick="cashOut()" disabled>CASH OUT</button>
        <p id="status"></p>
    </div>

    <script>
        let count = 1.00;
        let timer;
        let active = false;

        function startGame() {
            count = 1.00;
            active = true;
            document.getElementById('status').innerText = "";
            document.getElementById('multiplier').style.color = "#00ff00";
            document.getElementById('startBtn').disabled = true;
            document.getElementById('cashOutBtn').disabled = false;
            
            let crash = (Math.random() * 4 + 1).toFixed(2);
            
            timer = setInterval(() => {
                count += 0.01;
                document.getElementById('multiplier').innerText = count.toFixed(2) + "x";
                if (count >= crash) {
                    clearInterval(timer);
                    document.getElementById('multiplier').innerText = "CRASHED!";
                    document.getElementById('multiplier').style.color = "red";
                    reset();
                }
            }, 50);
        }

        function cashOut() {
            if (active) {
                clearInterval(timer);
                document.getElementById('status').innerText = "You Won: " + count.toFixed(2) + "x";
                reset();
            }
        }

        function reset() {
            active = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cashOutBtn').disabled = true;
        }
    </script>
</body>
</html>
